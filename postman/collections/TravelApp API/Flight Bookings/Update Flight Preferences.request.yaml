$kind: http-request
method: PUT
url: '{{baseUrl}}/api/v1/customers/{{customerId}}/flight-bookings/{{flightBookingId}}/preferences'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{accessToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "meal": 1,
      "seatPreference": 1
    }
