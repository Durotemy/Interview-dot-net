$kind: http-request
name: Create Flight Booking
method: POST
url: '{{baseUrl}}/api/v1/customers/{{customerId}}/flight-bookings'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "travellerId": "{{travellerId}}",
      "flightNumber": "AA123",
      "origin": "New York",
      "destination": "London",
      "departureDate": "2025-06-01",
      "meal": 0,
      "seatPreference": 0
    }
