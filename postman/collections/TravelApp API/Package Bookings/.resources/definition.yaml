$kind: collection
name: Package Bookings
description: |-
  Book a travel package for a customer. This atomically creates both a room booking and a flight booking.

  **Base route:** `api/v1/customers/{customerId}/packages/{packageId}/bookings`

  Requires `customerId`, `packageId`, and `travellerId` to be set in the environment.

  **Auth:** Requires a Bearer token. Run **Auth → Login** first; it sets `accessToken` and `customerId` automatically. Using another customer's `customerId` returns 403.
order: 7000
